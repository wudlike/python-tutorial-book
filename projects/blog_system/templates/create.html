{% extends "base.html" %}

{% block title %}{{ action }}文章 - 我的技术博客{% endblock %}

{% block content %}
    <h2>{{ action }}文章</h2>

    <form method="post" class="post-form">
        <div>
            <label for="title">标题</label><br>
            <input type="text" id="title" name="title" required
                   value="{{ post.title if post else '' }}"
                   placeholder="输入文章标题">
        </div>

        <div>
            <label for="tags">标签（用逗号分隔）</label><br>
            <input type="text" id="tags" name="tags"
                   value="{{ post.tags if post else '' }}"
                   placeholder="如：Python, Flask, 教程">
        </div>

        <div>
            <label for="content">正文</label><br>
            <textarea id="content" name="content" rows="15" required
                      placeholder="输入文章内容...">{{ post.content if post else '' }}</textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">保存</button>
            <a href="{{ url_for('index') }}" class="btn">取消</a>
        </div>
    </form>
{% endblock %}
