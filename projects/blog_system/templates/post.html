{% extends "base.html" %}

{% block title %}{{ post.title }} - 我的技术博客{% endblock %}

{% block content %}
    <article>
        <h2>{{ post.title }}</h2>
        <p class="meta">
            📅 {{ post.created_at }}
            {% if post.tags %}| 🏷️ {{ post.tags }}{% endif %}
        </p>
        <div class="post-content">
            <p>{{ post.content }}</p>
        </div>
        <div class="actions">
            <a href="{{ url_for('edit_post', post_id=post.id) }}" class="btn">编辑</a>
            <form method="post" action="{{ url_for('delete_post', post_id=post.id) }}"
                  style="display:inline"
                  onsubmit="return confirm('确定要删除吗？')">
                <button type="submit" class="btn btn-danger">删除</button>
            </form>
            <a href="{{ url_for('index') }}" class="btn">返回列表</a>
        </div>
    </article>
{% endblock %}
